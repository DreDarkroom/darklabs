<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dre | DJ, drummer, builder of small instruments</title>
<meta name="description" content="Dre: DJ and drummer who builds little instruments for the browser. Everything lives at dredarkroom.com.">
<style>
:root{--ink:#050304;--red:#d1122b;--soft:#e8434f;--text:#eadede;--dim:#b09c9c;--mx:50vw;--my:40vh}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--text);font:18px/1.6 ui-sans-serif,system-ui,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle 360px at var(--mx) var(--my),rgba(209,18,43,.24),transparent 70%),radial-gradient(circle at 50% 120%,#1a0508,transparent 60%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.card{position:relative;z-index:1;max-width:30rem;margin:0 auto;padding:12vh 1.3rem 4rem;text-align:center}
.mark{width:6.2rem;height:6.2rem;border-radius:50%;margin:0 auto 1.4rem;display:grid;place-items:center;font:800 2.4rem/1 ui-monospace,Consolas,monospace;color:var(--red);border:2px solid var(--red);box-shadow:0 0 40px rgba(209,18,43,.4),inset 0 0 24px rgba(209,18,43,.25)}
h1{margin:0;font-size:2.4rem;letter-spacing:-.02em}
.tag{color:var(--dim);margin:.3rem 0 2rem}
.links{display:grid;gap:.7rem}
.links a{display:block;padding:.95rem 1.1rem;border:1px solid #3a1a1f;border-radius:.7rem;background:rgba(255,255,255,.025);color:var(--text);text-decoration:none;font-weight:600;transition:border-color .2s,transform .2s,background .2s}
.links a:hover,.links a:focus-visible{border-color:var(--soft);background:rgba(209,18,43,.12);transform:translateY(-2px);outline:none}
.links small{display:block;color:var(--dim);font-weight:400;font-size:.85rem}
.links a.main{border-color:var(--red);background:rgba(209,18,43,.16)}
footer{margin-top:2.4rem;color:var(--dim);font-size:.85rem}
</style>
</head>
<body>
<main class="card">
  <div class="mark" aria-hidden="true">D</div>
  <h1>Dre</h1>
  <p class="tag">DJ &middot; Drummer &middot; I build little instruments for the browser</p>
  <nav class="links" aria-label="Links">
    <a class="main" href="https://dredarkroom.com/">dredarkroom.com<small>The main site. Scroll and it plays music.</small></a>
    <a href="https://dredarkroom.github.io/DevelopDrop/" rel="noopener">DevelopDrop<small>A bass synth, three drummers and a squeegee</small></a>
    <a href="https://dredarkroom.github.io/darklabs/" rel="noopener">Darklabs<small>Every instrument and experiment</small></a>
    <a href="https://twitch.tv/dredarkroom" rel="noopener">Twitch<small>Live</small></a>
    <a href="https://mixcloud.com/darkroom" rel="noopener">Mixcloud<small>DJ sets</small></a>
    <a href="https://soundcloud.com/dredarkroom" rel="noopener">SoundCloud<small>Music</small></a>
  </nav>
  <footer>dre.me.uk &middot; short and sweet</footer>
</main>
<script>
// the safelight drifts after the pointer, lazily; with reduced motion it just sits still
const root = document.documentElement, reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let mx = innerWidth / 2, my = innerHeight * .4, tx = mx, ty = my;
addEventListener("pointermove", (e) => { tx = e.clientX; ty = e.clientY; }, { passive: true });
(function f() { if (!reduce) { mx += (tx - mx) * .08; my += (ty - my) * .08; root.style.setProperty("--mx", mx + "px"); root.style.setProperty("--my", my + "px"); requestAnimationFrame(f); } })();
</script>
</body>
</html>
