<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sean Boon</title>
<meta name="description" content="Sean Boon.">
<style>
:root{--bg:#0d1117;--ink:#eae6dc;--dim:#8c8f96}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%}
main{position:fixed;inset:0;display:grid;place-content:center;text-align:center;padding:1rem}
h1{margin:0;font:400 clamp(2.4rem,9vw,6rem)/1.05 "Iowan Old Style",Georgia,"Times New Roman",serif;letter-spacing:-.01em}
p{margin:1rem 0 0;color:var(--dim);font:.8rem/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.4em;text-transform:uppercase}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<main><h1>Sean Boon</h1><p>seanboon.org.uk</p></main>
<script>
// a slow field of drifting dots that rest in a grid when the pointer is still. Quiet and unhurried; static if you prefer reduced motion.
const c = document.getElementById("c"), g = c.getContext("2d"), reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let W, H, dots = [], mx = -1e4, my = -1e4;
function init() { W = c.width = innerWidth; H = c.height = innerHeight; dots = []; const s = Math.max(34, Math.min(W, H) / 16); for (let y = s / 2; y < H; y += s) for (let x = s / 2; x < W; x += s) dots.push({ ox: x, oy: y, x, y, p: Math.random() * 6.28 }); }
init(); addEventListener("resize", init);
addEventListener("pointermove", (e) => { mx = e.clientX; my = e.clientY; }, { passive: true });
let t = 0;
function f() {
  t += .006; g.clearRect(0, 0, W, H);
  for (const d of dots) {
    let tx = d.ox + Math.sin(t + d.p) * 5, ty = d.oy + Math.cos(t * .8 + d.p) * 5;
    const dx = d.ox - mx, dy = d.oy - my, dist = Math.hypot(dx, dy), push = reduce ? 0 : Math.max(0, 1 - dist / 160) * 26;
    if (dist > 0) { tx += dx / dist * push; ty += dy / dist * push; }
    d.x += (tx - d.x) * .08; d.y += (ty - d.y) * .08;
    g.fillStyle = "rgba(234,230,220," + (0.1 + Math.max(0, 1 - dist / 220) * .5) + ")"; g.beginPath(); g.arc(d.x, d.y, 1.6 + Math.max(0, 1 - dist / 200) * 2.4, 0, 6.283); g.fill();
  }
  if (!reduce) requestAnimationFrame(f);
}
f();
</script>
</body>
</html>
