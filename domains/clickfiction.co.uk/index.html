<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Click Fiction | short stories you click through</title>
<meta name="description" content="Short stories you read one click at a time. This one is called The Lift.">
<style>
:root{--ink:#0a0b10;--paper:#efe6d6;--dim:#a89f90;--gold:#e3b869}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--paper);font:20px/1.7 Georgia,"Times New Roman",serif}
#sky{position:fixed;inset:0;width:100%;height:100%;opacity:.5}
.wrap{position:relative;max-width:36rem;margin:0 auto;padding:2.2rem 1.2rem 5rem;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;font:14px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
button{font:inherit;cursor:pointer;color:var(--paper);background:none;border:1px solid #4a4538;border-radius:.4rem;padding:.55rem .9rem;min-height:2.6rem}
button:hover{border-color:var(--gold);color:#fff}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.top button{font:12px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.15em;text-transform:uppercase;padding:.5rem .8rem}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:2rem 0}
h1{font-weight:400;font-size:clamp(2.2rem,8vw,3.4rem);line-height:1.05;margin:0 0 .6rem;letter-spacing:-.01em}
.by{color:var(--dim);font-style:italic;margin:0 0 2rem}
#text p{margin:0 0 1.1rem}
#text{min-height:9rem}
.choices{display:flex;flex-direction:column;gap:.7rem;margin-top:1.4rem}
.choices button{text-align:left;font-size:1.05rem;border-color:#3b3629;background:rgba(255,255,255,.03)}
.end{color:var(--gold);font-style:italic}
.meta{color:var(--dim);font:13px/1.5 ui-sans-serif,system-ui,sans-serif;margin-top:1.6rem}
a{color:var(--gold)}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="top"><span>Click Fiction</span><button id="snd" aria-pressed="false">Sound off</button></div>
  <main>
    <h1 id="title">The Lift</h1>
    <p class="by" id="by">a short story, one click at a time</p>
    <div id="text" aria-live="polite"></div>
    <div class="choices" id="choices"></div>
    <p class="meta" id="meta"></p>
  </main>
</div>
<script type="module">
import { room } from "../_shared/room.js";
const $ = (id) => document.getElementById(id);

// The story: each node is some paragraphs and some choices. An ending has none. Depth lifts the music (see ascent below).
const N = {
  start: { t: ["The lift stops between the sixth floor and the seventh.", "The light flickers once, then settles into a hum, as if it's thinking about you."], c: [["Press the alarm", "alarm"], ["Press 7", "seven"], ["Wait", "wait"]] },
  alarm: { t: ["Somewhere far above you a bell rings, politely, like a doorbell in another house. Nobody comes.", "But the panel has lit a button you hadn't noticed. It has no number. It has a tiny drawing of a key."], c: [["Press the key", "key"], ["Press 7", "seven"]] },
  wait: { t: ["You wait. The hum rises by half a tone.", "Then the lift speaks, in your own voice: “Take your time.”", "It's the kindest thing anyone has said to you all week."], c: [["Say thank you", "thank"], ["Press the alarm", "alarm"]] },
  seven: { t: ["The lift climbs, shuddering, and opens onto a corridor you've never seen.", "Seven should be offices. This is carpeted and quiet, and every door has your name on it."], c: [["Open the nearest door", "door"], ["Go back to the lift", "lift2"]] },
  key: { t: ["The button clicks. The floor numbers shuffle like a deck of cards and settle on a single word.", "LATER."], c: [["Press LATER", "later"], ["Press 7", "seven"]] },
  door: { t: ["Inside is your flat, but lived in by someone calmer. The kettle is on.", "There's a note on the table: “You left the stove on in 2019. We dealt with it.”"], c: [["Sit down", "home"], ["Leave quietly", "seven"]] },
  lift2: { t: ["The lift is waiting with its doors open, as if it never left.", "“Floor?” it asks."], c: [["“Up.”", "up"], ["“Out.”", "out"]] },
  thank: { end: "The doors open on seven, which, this time, is exactly where you were going.", e: "arrived" },
  later: { end: "The doors open onto morning. Whatever you were worrying about is smaller from here.", e: "later" },
  home: { end: "You sit. For the first time in a long while, you are not late for anything.", e: "home" },
  up: { end: "It keeps climbing. Past seven, past twenty, past the roof, into a blue you don't have a word for. The hum resolves into a chord.", e: "up", peak: true },
  out: { end: "The doors open on the street where you started. Everything is the same, except you know the lift is there if you need it.", e: "out" },
};
const ENDINGS = 5;
let found = new Set(); try { found = new Set(JSON.parse(localStorage.getItem("clickfiction.lift") || "[]")); } catch (e) { /* storage may be blocked */ }

const r = room({ canvas: $("sky"), bpm: 66, key: 3, prog: "frahm", ascent: 0.06, space: 0.6, eco: true });
$("snd").addEventListener("click", async () => { const on = !r.on; await r.sound(on); $("snd").textContent = on ? "Sound on" : "Sound off"; $("snd").setAttribute("aria-pressed", String(on)); });

let depth = 0;
function show(id) {
  const n = N[id]; $("title").hidden = $("by").hidden = id !== "start" ? true : false;
  const box = $("text"); box.textContent = ""; const ch = $("choices"); ch.textContent = "";
  (n.t || [n.end]).forEach((p, i) => { const el = document.createElement("p"); el.textContent = p; if (n.end) el.className = "end"; box.appendChild(el); });
  if (n.end) {
    found.add(n.e); try { localStorage.setItem("clickfiction.lift", JSON.stringify([...found])); } catch (e) { /* ignore */ }
    r.ascent = n.peak ? 1 : 0.18; if (n.peak && r.on) { r.engine.voices.impact(r.engine.now + 0.05); r.tunnel.boom(); }
    $("meta").textContent = "Ending " + found.size + " of " + ENDINGS + " found.";
    const again = document.createElement("button"); again.textContent = found.size >= ENDINGS ? "Read it again" : "Find another ending"; again.addEventListener("click", () => { depth = 0; r.ascent = 0.06; show("start"); }); ch.appendChild(again);
    if (found.size >= ENDINGS) { const m = document.createElement("p"); m.className = "meta"; m.innerHTML = "You found them all. More stories soon. Meanwhile: <a href=\"https://dredarkroom.com/\">Dre Darkroom</a>."; ch.appendChild(m); }
    again.focus(); return;
  }
  $("meta").textContent = "";
  n.c.forEach(([label, to]) => { const b = document.createElement("button"); b.textContent = label; b.addEventListener("click", () => { depth++; r.ascent = Math.min(0.7, 0.06 + depth * 0.11); show(to); }); ch.appendChild(b); });
}
show("start");
</script>
</body>
</html>
