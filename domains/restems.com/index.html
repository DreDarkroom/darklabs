<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reSTEMS | take a track apart, live</title>
<meta name="description" content="A track that writes itself, split into stems. Mute, solo and ride the faders while it climbs.">
<style>
:root{--bg:#0b0d12;--panel:#12151d;--line:#222735;--ink:#e9ecf4;--dim:#8d96ad}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif}
#sky{position:fixed;inset:0;width:100%;height:100%;opacity:.45;z-index:0}
.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:1.4rem 1rem 3rem}
h1{font:800 clamp(2rem,6vw,3.2rem)/1 ui-sans-serif,system-ui;letter-spacing:-.03em;margin:0}
h1 b{color:#ff5d73}
.sub{color:var(--dim);margin:.3rem 0 1.2rem}
.top{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
button{font:inherit;cursor:pointer;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:.55rem 1rem;min-height:2.6rem}
button:hover{border-color:#556}
button.go{background:#ff5d73;border-color:#ff5d73;color:#1a0509;font-weight:800}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.strips{display:grid;grid-template-columns:repeat(5,1fr);gap:.6rem}
@media(max-width:700px){.strips{grid-template-columns:repeat(5,minmax(0,1fr));gap:.3rem}.strip{padding:.5rem .25rem}.strip h3{font-size:.7rem}}
.strip{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:.8rem;padding:.8rem .6rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.5rem}
.strip h3{margin:0;font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.meter{width:100%;height:120px;background:#0a0c11;border-radius:.4rem;position:relative;overflow:hidden;border:1px solid var(--line)}
.meter i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,var(--c),#fff8)}
.fader{writing-mode:vertical-lr;direction:rtl;height:130px;width:30px;accent-color:var(--c)}
.ms{display:flex;gap:.3rem}
.ms button{padding:.2rem .6rem;min-height:2.2rem;font-weight:800}
.ms button[aria-pressed=true]{background:var(--c);color:#111;border-color:var(--c)}
.climb{display:flex;gap:.8rem;align-items:center;margin-top:1.1rem;background:var(--panel);border:1px solid var(--line);border-radius:.8rem;padding:.8rem 1rem}
.climb input{flex:1;accent-color:#ff5d73}
.foot{color:var(--dim);font-size:.9rem;margin-top:1.4rem}
a{color:#ff9aa8}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="wrap">
  <h1>re<b>STEMS</b></h1>
  <p class="sub">A track that writes itself, already split into stems. Take it apart while it plays.</p>
  <div class="top"><button class="go" id="play">&#9654; Play</button><button id="reset">All stems on</button></div>
  <div class="strips" id="strips"></div>
  <label class="climb"><span>Climb</span><input id="climb" type="range" min="0" max="100" value="45" aria-label="How far the track has climbed"><output id="climbv">45%</output></label>
  <p class="foot">Slide Climb up and the stems wake in turn: pad, marimba, bass, percussion. It's one living arrangement, not a recording. More from <a href="https://dredarkroom.com/">Dre Darkroom</a>.</p>
</div>
<script type="module">
import { room } from "../_shared/room.js";
const $ = (id) => document.getElementById(id);
const STEMS = [["piano", "Piano", "#ffb86b"], ["pluck", "Marimba", "#ff5d73"], ["pad", "Pad", "#8ea2ff"], ["bass", "Bass", "#58e0b0"], ["perc", "Perc", "#f4e06d"]];
const r = room({ canvas: $("sky"), bpm: 100, key: 9, prog: "frahm", ascent: 0.45, space: 0.4 });
const st = {}; let solo = null, analysers = {};

STEMS.forEach(([k, name, col]) => {
  const d = document.createElement("div"); d.className = "strip"; d.style.setProperty("--c", col);
  d.innerHTML = `<h3>${name}</h3><div class="meter"><i></i></div><input class="fader" type="range" min="0" max="100" value="100" orient="vertical" aria-label="${name} level"><div class="ms"><button data-m aria-pressed="false" aria-label="Mute ${name}">M</button><button data-s aria-pressed="false" aria-label="Solo ${name}">S</button></div>`;
  $("strips").appendChild(d); st[k] = { lvl: 1, mute: false, el: d };
  d.querySelector(".fader").addEventListener("input", (e) => { st[k].lvl = e.target.value / 100; apply(); });
  d.querySelector("[data-m]").addEventListener("click", (e) => { st[k].mute = !st[k].mute; e.currentTarget.setAttribute("aria-pressed", String(st[k].mute)); apply(); });
  d.querySelector("[data-s]").addEventListener("click", (e) => { solo = solo === k ? null : k; document.querySelectorAll("[data-s]").forEach((b) => b.setAttribute("aria-pressed", "false")); if (solo) e.currentTarget.setAttribute("aria-pressed", "true"); apply(); });
});
// bus gains: the engine's own per-instrument buses, scaled by the faders (they keep their house balance underneath)
let base = null;
function apply() {
  const g = r.engine.g; if (!g) return;
  if (!base) { base = {}; for (const k in g.buses) base[k] = g.buses[k].gain.value; }
  for (const [k] of STEMS) {
    const on = solo ? solo === k : !st[k].mute;
    g.buses[k].gain.setTargetAtTime(on ? base[k] * st[k].lvl : 0, r.engine.ctx.currentTime, 0.04);
  }
}
function tapMeters() {                                                  // one analyser per bus, for the meters
  const g = r.engine.g;
  for (const [k] of STEMS) { const a = r.engine.ctx.createAnalyser(); a.fftSize = 256; g.buses[k].connect(a); analysers[k] = { a, buf: new Float32Array(256) }; }
}
function meters() {
  for (const [k] of STEMS) {
    const m = analysers[k]; if (!m) continue;
    m.a.getFloatTimeDomainData(m.buf); let s = 0; for (const v of m.buf) s += v * v;
    const lvl = Math.min(1, Math.sqrt(s / m.buf.length) * 5);
    st[k].el.querySelector(".meter i").style.height = (lvl * 100).toFixed(0) + "%";
  }
  requestAnimationFrame(meters);
}
$("play").addEventListener("click", async () => {
  const on = !r.on; await r.sound(on);
  $("play").innerHTML = on ? "&#10074;&#10074; Pause" : "&#9654; Play";
  if (on && !Object.keys(analysers).length) { tapMeters(); apply(); requestAnimationFrame(meters); }
});
$("reset").addEventListener("click", () => {
  solo = null; for (const [k] of STEMS) { st[k].mute = false; st[k].lvl = 1; st[k].el.querySelector(".fader").value = 100; }
  document.querySelectorAll("[aria-pressed]").forEach((b) => { if (b.dataset.m !== undefined || b.dataset.s !== undefined) b.setAttribute("aria-pressed", "false"); });
  apply();
});
$("climb").addEventListener("input", (e) => { r.ascent = e.target.value / 100; $("climbv").textContent = e.target.value + "%"; });
</script>
</body>
</html>
