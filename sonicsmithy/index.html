<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonic Smithy — SFX forge for Godot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e63946"/><stop offset=".55" stop-color="#9d6bff"/><stop offset="1" stop-color="#22d3c0"/></linearGradient></defs><rect x="2" y="2" width="36" height="36" rx="9" fill="#0b0506" stroke="url(#g)" stroke-width="2"/><path d="M11 20h15M21 13l7 7-7 7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><h1>SONIC SMITHY</h1><small>sci-fi SFX forge · for Godot</small></div>
  </div>
  <nav id="tabs" aria-label="modules"></nav>
  <div class="tools">
    <canvas id="scope" width="120" height="34" title="output spectrum"></canvas>
    <label class="vol" title="master volume">vol <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"></label>
    <button id="stop" class="btn ghost" title="stop (Esc)">■</button>
  </div>
</header>
<main id="mods"></main>
<a class="brand-br" href="https://github.com/DreDarkroom" target="_blank" rel="noopener" title="Dre Darkroom"><i></i>DreDarkroom</a>
<script type="module" src="js/app.js"></script>
</body>
</html>
