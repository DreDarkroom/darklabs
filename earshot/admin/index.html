<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Earshot | S Pen Admin</title>

    <style>
        :root {
            --red: #690000;
            --red-soft: #a83232;
        }
        body {
            background-color: #000000; /* Pure black for OLED screens */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow: hidden; /* Prevent scrolling, this is a fixed stylus app */
            touch-action: none; /* Crucial for Pointer Events / S Pen to work without triggering browser scroll */
            user-select: none;
            -webkit-user-select: none;
        }
        /* Hide scrollbars completely for the mobile app feel */
        ::-webkit-scrollbar { display: none; }
    </style>

    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dre-red': '#690000',
                        'dre-red-soft': '#a83232',
                    }
                }
            }
        }
    </script>

    <!-- Import Maps for React & Babel -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client"
      }
    }
    </script>

    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

</head>
<body class="bg-black text-neutral-100 antialiased h-screen w-screen fixed inset-0 overflow-hidden">

    <div id="root" class="h-full w-full"></div>

    <script type="text/babel" data-type="module" src="./app.js"></script>

</body>
</html>
