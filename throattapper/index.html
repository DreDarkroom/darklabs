<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThroatTapper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>ThroatTapper</h1>
        
        <div class="controls">
            <button id="btn-drop" class="toggle-btn">DROP MODE: OFF</button>
        </div>

        <div class="instructions">
            <h2>Controls</h2>
            <p><strong>Numbers 1-4:</strong> Tap articulations</p>
            <ul>
                <li>1 = Soft Single Tap</li>
                <li>2 = Hard Single Tap</li>
                <li>3 = Double Tap</li>
                <li>4 = Rapid Run</li>
            </ul>
            <p><strong>A - ' (QWERTY middle row):</strong> Chromatic Tonal Hum</p>
            <p><em>Note: Upper row W,E,T,Y,U,O,P represent sharps/flats (black keys).</em></p>
        </div>
    </div>
    
    <script src="throattapper.js"></script>
</body>
</html>
